[project]
name = "directory-size-counter"
version = "0.1.0"
description = "Walks a tree and aggregates per-subdirectory byte counts and file counts into a nested summary."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
